<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2160">
<title>Rechnen-Tauziehen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Baloo 2","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --bg1:#232a8f; --bg2:#0e1246;
  --card:#ffffff; --text:#161a45; --muted:#555c8f;
  --sun:#ffd23f; --sun-d:#d9a400; --ink:#161a45;
  --p1:#ff7a3d; --p1d:#c9490f; --p2:#2f7bff; --p2d:#1650c9;
  --ok:#1faa59; --bad:#e5384f;
  box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#171c66;--bg2:#070a2c;--card:#1f2663;--text:#f3f5ff;--muted:#b4bbf0}
}
:root[data-theme="dark"]{--bg1:#171c66;--bg2:#070a2c;--card:#1f2663;--text:#f3f5ff;--muted:#b4bbf0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:var(--font);color:var(--text);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- Buttons ---------- */
.btn{
  border:0;border-radius:999px;background:var(--sun);color:var(--ink);font-weight:800;
  font-size:clamp(15px,4.6vh,22px);padding:.45em 1.3em;min-height:44px;cursor:pointer;
  box-shadow:0 4px 0 var(--sun-d);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.btn.big{font-size:clamp(20px,7vh,34px);padding:.35em 1.6em}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.65);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{
  border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;
  padding:.3em .9em;min-height:40px;font-weight:700;font-size:clamp(12px,3.8vh,17px);cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;color:#fff;min-height:0}
.bar h2{margin:0;font-size:clamp(18px,6vh,30px);text-align:center;flex:1}
.bar .btn{font-size:clamp(13px,4vh,18px)}

/* ---------- Start ---------- */
#sStart{align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,#3b45cf 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.hero{display:flex;align-items:center;justify-content:space-evenly;width:100%;height:100%;padding:2vh 3vw}
.hf{height:84%;flex:0 0 22%;display:flex;align-items:flex-end;justify-content:center}
.hf.r{transform:scaleX(-1)}
.hf img{height:100%;width:auto;max-width:100%;object-fit:contain;transform-origin:50% 92%;animation:lean 1.3s ease-in-out infinite alternate;-webkit-user-drag:none}
.hf.r img{animation-delay:-.65s}
@keyframes lean{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.titlebox{text-align:center;color:#fff;flex:1;max-width:48%}
.titlebox h1{
  margin:0 0 .15em;font-size:clamp(34px,15vh,84px);line-height:.92;font-weight:800;color:var(--sun);
  text-shadow:0 4px 0 #a97c00,0 9px 0 rgba(0,0,0,.28);
}
.titlebox p{margin:0 0 1em;font-size:clamp(13px,4.2vh,19px);font-weight:500;opacity:.92}

/* ---------- Stufen ---------- */
#sLevel{background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px 14px 8px}
.lv{
  --lc:#46c35c;border:0;border-top:9px solid var(--lc);border-radius:20px;background:var(--card);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.32);min-height:0;transition:transform .08s;
}
.lv:active{transform:translateY(4px)}
.lv:nth-child(2){--lc:#ffb020}.lv:nth-child(3){--lc:#ff4d6d}
.lv .stars{font-size:clamp(18px,6vh,30px);letter-spacing:.1em;color:var(--lc)}
.lv b{font-size:clamp(18px,6.4vh,30px);line-height:1}
.lv .desc{font-size:clamp(11px,3.5vh,16px);color:var(--muted);font-weight:500;line-height:1.15;max-width:22ch}
.lv .ex{margin-top:4px;padding:3px 12px;border-radius:10px;background:rgba(127,140,255,.18);font-weight:800;font-size:clamp(13px,4.2vh,20px)}
.opts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px;padding:2px 14px 10px;color:#fff;font-weight:700;font-size:clamp(12px,3.8vh,17px)}
.seg{display:inline-flex;gap:6px;align-items:center}

/* ---------- Avatarwahl ---------- */
#sAvatar{background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.picks{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px 10px}
.pick{--pc:var(--p1);background:var(--card);color:var(--text);border-radius:18px;border-top:9px solid var(--pc);
  display:flex;flex-direction:column;padding:8px;min-height:0;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.pick[data-p="1"]{--pc:var(--p2)}
.phead{display:flex;align-items:center;gap:8px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;font-weight:800;display:grid;place-items:center}
.phead input{
  flex:1;min-width:0;font:700 16px var(--font);padding:5px 10px;border-radius:10px;border:2px solid var(--pc);
  background:transparent;color:var(--text);-webkit-user-select:text;user-select:text;
}
.aname{font-weight:800;font-size:clamp(12px,3.8vh,17px);white-space:nowrap;color:var(--pc)}
.pick[data-p="1"] .aname{color:var(--p2)}
.agrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.ab{position:relative;border:3px solid transparent;border-radius:12px;background:rgba(127,140,255,.16);padding:2px;min-height:0;min-width:0;cursor:pointer}
.ab{display:flex;align-items:flex-end;justify-content:center}
.ab img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;-webkit-user-drag:none}
.ab.blank{border:3px dashed rgba(127,140,255,.5);background:transparent;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:clamp(10px,3vh,14px);cursor:default}
.pick[data-p="1"] .ab img{transform:scaleX(-1)}
.ab.sel{border-color:var(--pc);background:rgba(127,140,255,.3)}
.ab.sel::after{content:"✓";position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.ab.taken{opacity:.28;pointer-events:none;filter:grayscale(.8)}

/* ---------- Spiel ---------- */
#sGame.active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);gap:6px;padding:6px}
.calc{
  --c:var(--p1);--cd:var(--p1d);display:grid;grid-template-rows:auto minmax(0,.9fr) minmax(0,3fr);gap:6px;min-height:0;
  background:linear-gradient(var(--c),var(--cd));border-radius:18px;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.4);
}
.calc.p2{--c:var(--p2);--cd:var(--p2d)}
.calc.flip{transform:rotate(180deg)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:clamp(11px,3.5vh,16px);min-width:0}
.chead span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcd{
  position:relative;background:#e4f7e4;color:#13241a;border-radius:10px;padding:3px 8px;display:grid;grid-template-rows:auto minmax(0,1fr);
  min-height:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.2);overflow:hidden;font-variant-numeric:tabular-nums;
}
.task{text-align:right;white-space:nowrap;overflow:hidden;font-weight:700;line-height:1.2;opacity:.9}
.inp{text-align:right;white-space:nowrap;overflow:hidden;font-weight:800;border-top:2px dashed rgba(0,0,0,.2);align-self:center;line-height:1.25;min-height:1.25em}
.inp::after{content:"";display:inline-block;width:3px;height:.9em;background:#13241a;margin-left:3px;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
.inp.rev{color:#0a6b35}.inp.rev::after{display:none}
@keyframes blink{50%{opacity:0}}
.fb{position:absolute;left:8px;top:50%;font-size:2em;font-weight:800;pointer-events:none;opacity:0;transform:translateY(-50%) scale(.4)}
.calc.ok .fb,.calc.bad .fb{animation:pop .6s ease-out}
.calc.ok .lcd{animation:okflash .55s}
.calc.bad .lcd{animation:shake .38s,badflash .5s}
@keyframes pop{0%{opacity:1;transform:translateY(-50%) scale(.4)}30%{opacity:1;transform:translateY(-50%) scale(1.2)}100%{opacity:0;transform:translateY(-50%) scale(1)}}
@keyframes okflash{0%,40%{background:#a6f2bd}100%{background:#e4f7e4}}
@keyframes badflash{0%,40%{background:#ffb4bd}100%{background:#e4f7e4}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:5px;min-height:0}
.keys button{
  border:0;border-radius:12px;background:#fff;color:var(--cd);font-weight:800;font-size:clamp(18px,6.2vh,30px);
  box-shadow:0 3px 0 rgba(0,0,0,.3);padding:0;min-height:0;min-width:0;cursor:pointer;
}
.keys button.down,.keys button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.3)}
.keys .del{background:#ffe08a;color:#6b4a00}
.keys .okb{background:#2fd16b;color:#fff;font-size:clamp(16px,5.2vh,26px)}
.center{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5px;min-height:0;position:relative}
.topbar{display:flex;align-items:center;gap:6px}
.tag{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 10px;border-radius:999px;color:#fff;font-weight:800;font-size:clamp(11px,3.6vh,16px)}
.tag.t0{background:var(--p1d)}.tag.t1{background:var(--p2d)}
.tag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.3);cursor:pointer}
.stage{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:#4fb3ff;box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.stage svg{width:100%;height:100%;display:block}
.count{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-weight:800;font-size:min(30vh,120px);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;
}
.count.pop{animation:cpop .8s ease-out}
@keyframes cpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.meter{position:relative;height:14px;border-radius:7px;background:var(--p2);overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.75)}
.meter .ml{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--p1);transition:width .35s}
.meter::after{content:"";position:absolute;left:calc(50% - 1.5px);top:0;bottom:0;width:3px;background:#fff}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(10,12,50,.78);z-index:5;color:#fff;text-align:center}
.overlay.on{display:flex}
.overlay h2{margin:0;font-size:clamp(24px,10vh,48px)}
.overlay .row{display:flex;gap:12px}

/* ---------- Sieger ---------- */
#sWin{background:radial-gradient(circle at 30% 50%,#3b45cf 0,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));align-items:center;justify-content:center;overflow:hidden}
.winwrap{display:flex;align-items:center;justify-content:center;gap:3vw;width:100%;height:100%;padding:2vh 4vw;position:relative;z-index:2}
.wav{height:92%;flex:0 0 26%;display:flex;align-items:flex-end;justify-content:center}
.wav img{height:100%;width:auto;max-width:100%;object-fit:contain;transform-origin:50% 100%;animation:jump .7s ease-in-out infinite alternate;-webkit-user-drag:none}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-4%) rotate(2deg)}}
.wtxt{flex:1;color:#fff;min-width:0}
.wtxt h2{margin:0 0 4px;font-size:clamp(24px,10vh,46px);line-height:1;color:var(--sun);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.wsub{color:#fff;opacity:.9;font-weight:600;font-size:clamp(12px,4vh,18px);margin-bottom:2px}
.stats{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:clamp(12px,4vh,18px);font-weight:700}
.stats th,.stats td{padding:3px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,.25)}
.stats td:first-child{text-align:left;font-weight:500;opacity:.9}
.stats th.c0{color:#ffb792}.stats th.c1{color:#9fc3ff}
.stats th{font-weight:800}
.wbtns{display:flex;flex-wrap:wrap;gap:8px}
.wbtns .btn{font-size:clamp(13px,4.2vh,19px)}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#confetti i{position:absolute;top:-6vh;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

/* ---------- Hochformat-Hinweis ---------- */
#rotate{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#fff;text-align:center;padding:24px;font-size:20px;font-weight:700}
#rotate .ph{width:54px;height:92px;border:5px solid #fff;border-radius:12px;animation:turn 2.2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:340px){.calc{padding:5px;gap:4px}.keys{gap:4px}#sGame.active{gap:4px;padding:4px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #confetti{display:none}
}
</style>
</head>
<body>
<div id="app">

  <!-- Startbildschirm -->
  <section class="screen" id="sStart">
    <div class="hero">
      <div class="hf" id="heroL"></div>
      <div class="titlebox">
        <h1>Rechen-<br>Tauziehen</h1>
        <p>Löse Aufgaben schneller als dein Gegner und zieh ihn in den Matsch!</p>
        <button class="btn big" id="btnPlay">Spielen</button>
      </div>
      <div class="hf r" id="heroR"></div>
    </div>
  </section>

  <!-- Stufenwahl -->
  <section class="screen" id="sLevel">
    <header class="bar">
      <button class="btn ghost" data-back="sStart">‹ Zurück</button>
      <h2>Wähle die Stufe</h2>
      <span style="width:96px"></span>
    </header>
    <div class="levels">
      <button class="lv" data-l="1"><span class="stars" aria-label="1 Stern">★☆☆</span><b>Stufe 1</b><span class="desc">Plus, minus bis 100, kleines Einmaleins, Teilen</span><span class="ex">47 + 38 =</span></button>
      <button class="lv" data-l="2"><span class="stars" aria-label="2 Sterne">★★☆</span><b>Stufe 2</b><span class="desc">Bis 1.000, Zehnerzahlen, zweistellig mal einstellig</span><span class="ex">46 · 7 =</span></button>
      <button class="lv" data-l="3"><span class="stars" aria-label="3 Sterne">★★★</span><b>Stufe 3</b><span class="desc">Bis 100.000, Punkt vor Strich, Klammern</span><span class="ex">3 · 8 + 15 =</span></button>
    </div>
    <div class="opts">
      <span class="seg">Seillänge:
        <button class="chip" data-r="kurz" aria-pressed="false">Kurz</button>
        <button class="chip" data-r="normal" aria-pressed="true">Normal</button>
        <button class="chip" data-r="lang" aria-pressed="false">Lang</button>
      </span>
      <button class="chip" id="optMirror" aria-pressed="false">Tischmodus: aus</button>
      <button class="chip" id="optSound" aria-pressed="true">Ton: an</button>
    </div>
  </section>

  <!-- Avatarwahl -->
  <section class="screen" id="sAvatar">
    <header class="bar">
      <button class="btn ghost" data-back="sLevel">‹ Zurück</button>
      <h2>Wähle deine Figur</h2>
      <button class="btn" id="btnGo">Los geht's!</button>
    </header>
    <div class="picks">
      <div class="pick" data-p="0">
        <div class="phead"><span class="badge">1</span><input maxlength="12" placeholder="Name (Spieler 1)" aria-label="Name Spieler 1" autocomplete="off"><span class="aname"></span></div>
        <div class="agrid"></div>
      </div>
      <div class="pick" data-p="1">
        <div class="phead"><span class="badge">2</span><input maxlength="12" placeholder="Name (Spieler 2)" aria-label="Name Spieler 2" autocomplete="off"><span class="aname"></span></div>
        <div class="agrid"></div>
      </div>
    </div>
  </section>

  <!-- Spiel -->
  <section class="screen" id="sGame">
    <section class="calc p1" data-p="0"></section>
    <section class="center">
      <div class="topbar">
        <div class="tag t0"><span class="nm" id="nm0"></span><span id="sc0">✓ 0</span></div>
        <button class="ib" id="btnPause" aria-label="Pause">⏸</button>
        <button class="ib" id="btnMute" aria-label="Ton an oder aus">🔊</button>
        <div class="tag t1"><span class="nm" id="nm1"></span><span id="sc1">✓ 0</span></div>
      </div>
      <div class="stage">
        <svg id="scene" viewBox="0 0 420 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tauziehen-Spielfeld"></svg>
        <div class="count" id="count"></div>
      </div>
      <div class="meter" aria-hidden="true"><div class="ml" id="ml"></div></div>
    </section>
    <section class="calc p2" data-p="1"></section>
    <div class="overlay" id="pauseOv">
      <h2>Pause</h2>
      <div class="row">
        <button class="btn" id="btnResume">Weiter</button>
        <button class="btn ghost" id="btnQuit">Zum Start</button>
      </div>
    </div>
  </section>

  <!-- Sieger -->
  <section class="screen" id="sWin">
    <div id="confetti"></div>
    <div class="winwrap">
      <div class="wav" id="wAv"></div>
      <div class="wtxt">
        <h2 id="wTitle"></h2>
        <div class="wsub" id="wSub"></div>
        <table class="stats" id="wStats"></table>
        <div class="wbtns">
          <button class="btn" id="bRe">Revanche</button>
          <button class="btn ghost" id="bLv">Andere Stufe</button>
          <button class="btn ghost" id="bAv">Neue Figuren</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="rotate"><div class="ph"></div><div>Bitte drehe dein Gerät ins Querformat.</div></div>

<script id="avatar-tabelle">
/* =====================================================================
   AVATAR-TABELLE – 12 Plätze: obere Reihe 6 männlich, untere Reihe 6 weiblich
   Belegt: alle 12 Plätze. Ein Platz kann so freigegeben werden: { frei:true, geschlecht:'m'|'f' }

   Einen Platz neu belegen: den Eintrag (auch einen freien { frei:true, … }) ersetzen durch
     { name:'Name', titel:'Der …', geschlecht:'m',
       bild:'data:image/webp;base64,…' }
   Das Bild sollte ein Freisteller (transparenter Hintergrund, WebP oder PNG)
   sein, ganze Figur, Füße unten. Breite, Höhe und Standpunkt (w, h, ax)
   erkennt das Spiel selbst, wenn sie fehlen.

   Optionale Felder für die Animation (sonst gelten Standardwerte):
     groesse: Körpergröße in der Szene (Kopf bis Füße), Standard 112
              (Zwerg 84, Kind ~100, Mensch ~115, Ork 146, Roboter 156)
     kopf   : Oberkante des Kopfes als Anteil der Bildhöhe (0 = ganz oben), Standard 0
     fuss   : Standlinie der Füße als Anteil der Bildhöhe (1 = Bildunterkante), Standard 1

/* Fehlen Breite/Höhe/Standpunkt (neu eingefügtes Bild), werden sie hier ermittelt. */
function prepareAvatar(a){
  return new Promise(res => {
    const im = new Image();
    const done = () => { a.w = a.w || 300; a.h = a.h || 500; if (a.ax == null) a.ax = .5; res(); };
    im.onload = () => {
      a.w = im.naturalWidth; a.h = im.naturalHeight;
      try {
        const c = document.createElement('canvas'); c.width = 64; c.height = Math.max(1, Math.round(64 * a.h / a.w));
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        const d = x.getImageData(0, 0, c.width, c.height).data; let s = 0, sx = 0;
        for (let yy = 0; yy < c.height; yy++) for (let xx = 0; xx < c.width; xx++){ const al = d[(yy * c.width + xx) * 4 + 3]; s += al; sx += al * xx; }
        a.ax = s ? sx / s / c.width : .5;
      } catch(e){ a.ax = .5; }
      res();
    };
    im.onerror = done; im.src = a.bild;
  });
}

/* =====================================================================
   3. AUFGABENGENERATOR (nur ganzzahlige, nicht negative Ergebnisse)
   ===================================================================== */
const mk = (text, answer) => ({ text: text + ' =', answer });
const GEN = {
  1(){ // Stufe 1: bis 100, kleines Einmaleins
    const t = pick(['add','add','sub','sub','mul','mul','div','div']);
    if (t === 'add'){ const a = R(10,89), b = R(2,100 - a); return mk(`${a} + ${b}`, a + b); }
    if (t === 'sub'){ const a = R(20,100), b = R(2,a - 1); return mk(`${a} − ${b}`, a - b); }
    if (t === 'mul'){ const a = R(2,10), b = R(2,10); return mk(`${a} · ${b}`, a * b); }
    const b = R(2,10), q = R(2,10); return mk(`${b * q} : ${b}`, q);
  },
  2(){ // Stufe 2: bis 1.000, zweistellig × einstellig, Zehnerzahlen
    const t = pick(['add','add','sub','sub','mul','mul','mulz','mix','div','div']);
    if (t === 'add'){ const a = R(100,899), b = R(20,1000 - a); return mk(`${a} + ${b}`, a + b); }
    if (t === 'sub'){ const a = R(200,1000), b = R(50,a - 10); return mk(`${a} − ${b}`, a - b); }
    if (t === 'mul'){ const a = R(12,99), b = R(2,9); return mk(`${a} · ${b}`, a * b); }
    if (t === 'mulz'){ const a = R(2,9) * 10, b = pick([R(2,9), R(2,9) * 10]); return mk(`${a} · ${b}`, a * b); }
    if (t === 'mix'){ const a = R(3,12), b = R(3,12); return mk(`${a} · ${b}`, a * b); }
    const b = R(2,9), q = R(Math.ceil(12 / b), Math.floor(99 / b)); return mk(`${b * q} : ${b}`, q);
  },
  3(){ // Stufe 3: bis 100.000, 2-stellig × 2-stellig, Punkt vor Strich, Klammern
    const t = pick(['add','sub','mul','mulz','div','divz','multi','multi','multi']);
    if (t === 'add'){
      if (Math.random() < .5){ const a = R(1000,8999), b = R(100,10000 - a); return mk(`${fmt(a)} + ${fmt(b)}`, a + b); }
      const a = R(100,899) * 100, b = R(10,Math.floor((100000 - a) / 100)) * 100; return mk(`${fmt(a)} + ${fmt(b)}`, a + b);
    }
    if (t === 'sub'){
      if (Math.random() < .5){ const a = R(2000,10000), b = R(100,a - 100); return mk(`${fmt(a)} − ${fmt(b)}`, a - b); }
      const a = R(100,999) * 100, b = R(5,a / 100 - 1) * 100; return mk(`${fmt(a)} − ${fmt(b)}`, a - b);
    }
    if (t === 'mul'){ const a = R(12,35), b = R(11,19); return mk(`${a} · ${b}`, a * b); }
    if (t === 'mulz'){ const a = R(2,9) * pick([10,100]), b = R(2,9) * pick([1,10]); return mk(`${fmt(a)} · ${fmt(b)}`, a * b); }
    if (t === 'div'){ const b = R(2,9), q = R(12,120); return mk(`${fmt(b * q)} : ${b}`, q); }
    if (t === 'divz'){ const b = R(2,9) * 10, q = R(3,30); return mk(`${fmt(b * q)} : ${b}`, q); }
    // Mehrere Rechenschritte
    const k = pick(['a','b','c','d','e','f']);
    if (k === 'a'){ const a = R(2,9), b = R(2,9), c = R(5,60); return mk(`${a} · ${b} + ${c}`, a * b + c); }
    if (k === 'b'){ const a = R(2,9), b = R(2,9), c = R(5,60); return mk(`${c} + ${a} · ${b}`, c + a * b); }
    if (k === 'c'){ const a = R(2,9), b = R(2,9), c = a * b + R(5,40); return mk(`${c} − ${a} · ${b}`, c - a * b); }
    if (k === 'd'){ const a = R(2,30), b = R(2,30), c = R(2,9); return mk(`(${a} + ${b}) · ${c}`, (a + b) * c); }
    if (k === 'e'){ const a = R(4,12), b = R(4,9), c = R(5,a * b - 1); return mk(`${a} · ${b} − ${c}`, a * b - c); }
    const b = R(2,9), q = R(3,12), c = R(5,50); return mk(`${b * q} : ${b} + ${c}`, q + c);
  }
};
function genTask(level, prevText){
  let t;
  for (let i = 0; i < 10; i++){ t = GEN[level](); if (t.text !== prevText) break; }
  return t;
}

/* =====================================================================
   5. AUDIO (Web Audio, synthetisch)
   ===================================================================== */
let ac = null;
function audio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d, type, vol, delay, slide){
  if (!G.sound) return;
  const c = audio(); if (!c) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .15, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + .03);
}

/* ---------- Partikel ---------- */
function spawn(kind, x, y, o){
  if (G.parts.length > 170) return;
  o = o || {};
  const layer = o.back ? sceneRefs.fxBack : sceneRefs.fxFront, c = o.c || '#fff';
  let el;
  if (kind === 'ring') el = mkEl('circle', { fill:'none', stroke:c, 'stroke-width':o.sw || 3 }, layer);
  else if (kind === 'ering') el = mkEl('ellipse', { fill:'none', stroke:c, 'stroke-width':o.sw || 3 }, layer);
  else if (kind === 'star') el = mkEl('path', { d:STAR_D, fill:c }, layer);
  else if (kind === 'leaf') el = mkEl('ellipse', { rx:o.r || 5, ry:(o.r || 5) * .5, fill:c, stroke:OL, 'stroke-width':.6 }, layer);
  else if (kind === 'spark') el = mkEl('line', { stroke:c, 'stroke-width':o.sw || 1.6, 'stroke-linecap':'round' }, layer);
  else el = mkEl('circle', { fill:c }, layer);
  G.parts.push(Object.assign({ el, kind, vx:0, vy:0, g:0, life:0, max:1, r:3, r1:20, rot:0, vr:0, grow:0 }, o, { x, y }));
}
function updateParts(dt){
  for (let n = G.parts.length - 1; n >= 0; n--){
    const p = G.parts[n]; p.life += dt;
    const k = p.life / p.max;
    if (k >= 1){ p.el.remove(); G.parts.splice(n, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    const e = p.el, X = p.x.toFixed(1), Y = p.y.toFixed(1);
    e.setAttribute('opacity', (Math.min(1, k * 8) * (1 - k * k)).toFixed(2));
    if (p.kind === 'dot'){ e.setAttribute('cx', X); e.setAttribute('cy', Y); e.setAttribute('r', (p.r * (1 + p.grow * k)).toFixed(2)); }
    else if (p.kind === 'ring'){ e.setAttribute('cx', X); e.setAttribute('cy', Y); e.setAttribute('r', (p.r + (p.r1 - p.r) * easeOut(k)).toFixed(1)); }
    else if (p.kind === 'ering'){ const r = p.r + (p.r1 - p.r) * easeOut(k); e.setAttribute('cx', X); e.setAttribute('cy', Y); e.setAttribute('rx', r.toFixed(1)); e.setAttribute('ry', (r * .2).toFixed(1)); }
    else if (p.kind === 'star') e.setAttribute('transform', `translate(${X} ${Y}) rotate(${p.rot.toFixed(0)}) scale(${p.r})`);
    else if (p.kind === 'leaf') e.setAttribute('transform', `translate(${X} ${Y}) rotate(${p.rot.toFixed(0)})`);

/* ---------- Haltung (Pose) pro Figur und Frame ---------- */
function sigAdj(kind, t){
  const o = { y:0, lean:0, tx:0, sy:1 };
  if (RM) return o;
  if (kind === 'stampf'){
    if (t > .25 && t < .7){ const k = Math.sin(Math.PI * (t - .25) / .45); o.y = -38 * k; o.lean = 18 * k; }
    else if (t >= .7 && t < 1.05){ o.sy = .9; o.lean = 12; }

    if (t < REL) { o.y = -Math.abs(Math.sin(t * 9)) * 6; o.lean = Math.sin(t * 9) * 3; }
  } else if (kind === 'arkan'){
    if (t < REL + .35){ const k = smooth(t / .6); o.y = -16 * k + Math.sin(t * 6) * 1.5; o.lean = 20 * k; o.sy = 1; }
  } else if (kind === 'turbo'){

  } else if (kind === 'schatten'){
    if (t < REL + .2){ o.y = -Math.abs(Math.sin(t * 5)) * 8; o.lean = 8 * smooth(t / .5); }
  } else if (kind === 'strahl'){
    if (t < REL + .35){ const k = smooth(t / .5); o.y = -8 * k + Math.sin(t * 6); o.lean = 16 * k; }
  } else if (kind === 'hammer'){
    if (t < REL) { o.sy = 1 - .05 * smooth(t / .4); o.lean = 5 * smooth(t / .4); }
  } else if (kind === 'phoenix'){
    if (t < REL + .3){ const k = smooth(t / .5); o.lean = 14 * k; o.y = -6 * k; }
  } else if (kind === 'neon'){
    if (t < REL + .3){ o.y = -6 * smooth(t / .4); o.tx = Math.sin(t * 50) * .6; }
  } else if (kind === 'kristall'){
    if (t < REL + .3){ const k = smooth(t / .5); o.lean = 12 * k; o.y = -4 * k; }
  } else if (kind === 'dampf'){
    if (t < REL){ o.tx = Math.sin(t * 80) * 1.3; o.sy = 1 - .05 * smooth(t / .4); }

}
function computePose(i, bx, ov, dt){
  const st = G.pl[i];
  let x = bx, y = 0, tx = st.kick * .25, legSy = 1;
  let lean = -9 + (RM ? 0 : Math.sin(T * 2.6 + i * 1.9) * 2.2 + Math.sin(T * 19 + i) * .5 + Math.sin(T * 45) * st.wob) + st.kick;
  const mv = Math.min(1, Math.abs(G.pos - G.posCur) / 3);
  if (!RM) y = -Math.abs(Math.sin(T * 13 + i)) * 1.8 * mv;
  st.kick *= Math.exp(-dt * 5); st.wob *= Math.exp(-dt * 7);
  if (ov){
    const t = ov.t;
    if (i === ov.w){
      const c = easeOut(t / .4);
      lean = -9 - 16 * c + (RM ? 0 : Math.sin(t * 30) * 1.1); tx = -3 * c; legSy = 1 - .045 * c; y = 0;
      if (t >= REL){
        const r = (t - REL) / .35;
        if (r < 1) lean = -25 - 8 * Math.sin(r * Math.PI);
        else { const u = t - REL - .35; lean = -3 + (RM ? 0 : Math.sin(u * 5) * 4); tx = 0; legSy = 1; y = RM ? 0 : -Math.abs(Math.sin(u * 6)) * 14; }
      }
      const a = sigAdj(ov.kind, t); y += a.y; lean += a.lean; tx += a.tx; legSy *= a.sy;
    } else {
      const c = smooth(t / REL);
      lean = -9 + 14 * c + (RM ? 0 : Math.sin(t * 33) * 1.5); tx = 3 * c; y = 0;
      if (ov.kind === 'stampf' && t >= .7 && t < 1.0) y = -14 * Math.sin(Math.PI * (t - .7) / .3);
      if (t >= REL){
        const q = clamp((t - REL) / .55, 0, 1), s = smooth(q);

        if (t >= REL + .5){
          const f = clamp((t - REL - .5) / 1.3, 0, 1);

          if (f > .05 && !ov.splashed){ ov.splashed = true; splash(); }
        }

    }

}

  const f = figs[i], a = P.lean * DEG, cs = Math.cos(a), sn = Math.sin(a);

      c.el.setAttribute('opacity', t > 2.9 ? clamp(1 - (t - 2.9) / .6, 0, 1).toFixed(2) : 1); });
  }
  // Schattensprung (Malacor)
  else if (ov.kind === 'schatten'){
    const env = smooth((t - .15) / .3) * (t < REL + .25 ? 1 : clamp(1 - (t - REL - .25) / .3, 0, 1)), sgn = dir;
    ov.n.ghosts.forEach((g, k) => {
      g.setAttribute('transform', `translate(${(wx - dir * (14 + 14 * k) + Math.sin(t * 9 + k) * 2).toFixed(1)},${SC.groundY + P[w].y}) scale(${sgn},1)`);
      g.setAttribute('opacity', (env * [.34, .22, .13][k]).toFixed(2));
    });
    sceneRefs.dim.setAttribute('opacity', (.3 * env).toFixed(2));
    ov.n.moon.setAttribute('transform', `translate(${(wx - dir * 4).toFixed(1)} ${cy - 66}) rotate(${(-15 + dir * 10 * Math.sin(t * 2)).toFixed(1)}) scale(${(easeOut(t / .5) * (dir)).toFixed(2)},${easeOut(t / .5).toFixed(2)})`);
    ov.n.moon.setAttribute('opacity', env.toFixed(2));
    if (t > .1 && t < REL + .3 && every('sm', .05)) spawn('dot', wx + (Math.random() - .5) * 36, SC.groundY - 2, { c:['#2a1650', '#4b2a85', '#6a46b8'][Math.random() * 3 | 0], r:3 + Math.random() * 2.5, grow:2, vx:(Math.random() - .5) * 30, vy:-22 - Math.random() * 20, max:.85 });
  }
  // Energiestrahl (Volt)
  else if (ov.kind === 'strahl'){
    const on = t < REL + .5, s = easeOut(t / .5) * (1 + .08 * Math.sin(t * 12));
    const cxs = [wx - 31, wx + 31], cyo = cy - 6;
    ov.n.spirals.forEach((g, k) => { g.setAttribute('transform', `translate(${cxs[k].toFixed(1)} ${cyo}) rotate(${((k ? -1 : 1) * t * 480).toFixed(0)}) scale(${s.toFixed(2)})`); g.setAttribute('opacity', on ? 1 : 0); });
    if (t > .15 && t < REL && every('sp', .06)) spawn('star', cxs[Math.random() * 2 | 0] + (Math.random() - .5) * 30, cyo + (Math.random() - .5) * 30, { c:'#aef0ff', r:2.6, vx:(Math.random() - .5) * 40, vy:-20 - Math.random() * 30, max:.6, vr:240 });
    const bk = t >= REL && t < REL + .45 ? 1 - (t - REL) / .45 : 0;
    ['beamW', 'beam'].forEach((n, j) => { const e = ov.n[n];
      e.setAttribute('x1', gw.x.toFixed(1)); e.setAttribute('y1', gw.y.toFixed(1)); e.setAttribute('x2', gl.x.toFixed(1)); e.setAttribute('y2', gl.y.toFixed(1));
      e.setAttribute('opacity', bk.toFixed(2)); e.setAttribute('stroke-width', ((j ? 5.5 : 10) * (.7 + .5 * Math.sin(t * 60))).toFixed(1)); });
  }
  // Runen-Hammer (Grimbart)
  else if (ov.kind === 'hammer'){
    const mx = (gw.x + gl.x) / 2, my = (gw.y + gl.y) / 2;
    const appear = easeOut((t - .25) / .35), fall = clamp((t - (REL - .14)) / .14, 0, 1);
    const yoff = -64 * (1 - fall * fall) + (fall ? 0 : Math.sin(t * 7) * 2), rot = -26 * (1 - fall) + 8 * fall;
    const fade = t > REL + .55 ? clamp(1 - (t - REL - .55) / .3, 0, 1) : 1;
    ov.n.hammer.setAttribute('transform', `translate(${mx.toFixed(1)} ${(my + yoff).toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${(appear * 1.15).toFixed(2)})`);
    ov.n.hammer.setAttribute('opacity', (appear * fade).toFixed(2));
    if (t > .3 && t < REL && every('em', .08)) spawn('dot', gw.x, gw.y, { c:['#ff9a1a', '#ffd23f'][Math.random() * 2 | 0], r:2, vx:(Math.random() - .5) * 20, vy:-30 - Math.random() * 25, max:.6 });
    if (t >= REL && !ov.fl.hit){ ov.fl.hit = 1; ov.shake = Math.max(ov.shake, 8);
      for (let k = 0; k < 26; k++) spawn('spark', mx, my, { c:['#ffd23f', '#ff9a1a', '#fff'][Math.random() * 3 | 0], r:9, vx:(Math.random() - .5) * 420, vy:-70 - Math.random() * 230, g:560, max:.85, sw:2 });
      spawn('ring', mx, my, { c:'#ffb347', r:6, r1:70, max:.5, sw:4 }); }
  }
  // Phönix-Flug (Ember)
  else if (ov.kind === 'phoenix'){
    const ph = ov.n.ph, u = smooth((t - .3) / (REL - .15)), appear = easeOut((t - .2) / .3);
    const x = wx + (gl.x - wx) * u, y = cy - 26 - 34 * Math.sin(Math.PI * u), sc = (.55 + .8 * u) * appear;
    const gone = t > REL + .25 ? clamp(1 - (t - REL - .25) / .25, 0, 1) : 1;
    ph.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(dir * sc).toFixed(2)},${sc.toFixed(2)}) rotate(${(-12 * (1 - u) + 14 * u).toFixed(0)})`);
    ph.g.setAttribute('opacity', (appear * gone).toFixed(2));
    ph.wing.setAttribute('transform', `scale(1,${Math.cos(t * 22).toFixed(2)})`);
    if (t > .25 && t < REL + .25 && every('tr', .028)) spawn('dot', x - dir * 18 * sc, y + 3, { c:['#ff5a14', '#ffa61f', '#ffd23f'][Math.random() * 3 | 0], r:3.4 * sc, grow:-.7, vx:-dir * 10, vy:-14 - Math.random() * 14, max:.5 });
    if (t >= REL + .05 && !ov.fl.hit){ ov.fl.hit = 1; ov.shake = Math.max(ov.shake, 5);
      spawn('ring', gl.x, gl.y, { c:'#ff8a2b', r:6, r1:60, max:.5, sw:4 });
      for (let k = 0; k < 18; k++){ const a = k / 18 * 6.283; spawn('dot', gl.x, gl.y, { c:['#ff5a14', '#ffa61f', '#ffd23f'][k % 3], r:3.2, grow:-.5, vx:Math.cos(a) * 110, vy:Math.sin(a) * 110, max:.6 }); } }
  }
  // Neon-Wirbel (Sylphide)
  else if (ov.kind === 'neon'){
    const on = t < REL + .45, s = easeOut(t / .5), bx = wx, by = cy - 6;
    ov.n.blades.forEach((b, k) => { const a = t * 7 + k * Math.PI;
      b.setAttribute('transform', `translate(${(bx + Math.cos(a) * 38 * s).toFixed(1)} ${(by + Math.sin(a) * 31 * s).toFixed(1)}) rotate(${(a * 57.3 + 90).toFixed(0)}) scale(${(s * .9).toFixed(2)})`);
      b.setAttribute('opacity', on && ov.n.blades ? .95 : 0); });
    [ov.n.halo, ov.n.halo2].forEach((h, k) => { h.setAttribute('transform', `translate(${bx} ${by}) rotate(${((k ? -1 : 1) * t * 150).toFixed(0)}) scale(${s.toFixed(2)})`); h.setAttribute('opacity', on ? .9 : 0); });
    if (t > .15 && t < REL + .3 && every('ns', .04)) spawn('star', bx + (Math.random() - .5) * 90, by + (Math.random() - .5) * 80, { c:Math.random() < .5 ? '#ff6bd8' : '#43e8ff', r:2.4 + Math.random() * 2, vx:(Math.random() - .5) * 40, vy:-20 - Math.random() * 30, max:.6, vr:260 });
    if (t >= REL && !ov.fl.fly){ ov.fl.fly = 1;
      for (let k = 0; k < 10; k++) spawn('star', wx, by, { c:k % 2 ? '#43e8ff' : '#ff6bd8', r:4, vx:dir * (170 + Math.random() * 120), vy:(Math.random() - .5) * 70, max:.7, vr:300 }); }
  }
  // Kristallsturm (Elowen)
  else if (ov.kind === 'kristall'){
    const n = ov.n.cr;
    if (t > .2 && t < REL - .1 && n.length < 8 && every('cr', .085)){
      const k = n.length, x = wx + dir * (22 + 17 * k), hh = .75 + Math.random() * .5;
      const g = mkEl('g', {}, sceneRefs.fxFront);
      mkEl('path', { d:'M-6,0 L-4,-18 L0,-31 L4,-18 L6,0Z', fill:'#cdeeff', stroke:'#4a9ccc', 'stroke-width':1.3 }, g);
      mkEl('path', { d:'M0,-31 L0,0 L6,0 L4,-18Z', fill:'rgba(255,255,255,.6)' }, g);
      n.push({ g, x, hh, rot:(Math.random() - .5) * 18, t0:t });
      spawn('star', x, SC.groundY - 6, { c:'#e6f7ff', r:3, vx:(Math.random() - .5) * 30, vy:-40, max:.6, vr:200 });
    }
    n.forEach(c => { const k = easeOut((t - c.t0) / .22); c.g.setAttribute('transform', `translate(${c.x.toFixed(1)} ${SC.groundY + 2}) rotate(${c.rot.toFixed(0)}) scale(1.1,${(c.hh * k * 1.1).toFixed(2)})`); });
    if (t >= REL && !ov.fl.shat){ ov.fl.shat = 1;
      n.forEach(c => { for (let q = 0; q < 4; q++) spawn('star', c.x + (Math.random() - .5) * 8, SC.groundY - 10 - Math.random() * 20, { c:['#fff', '#bfe9ff', '#8fd0ff'][q % 3], r:3 + Math.random() * 2.5, vx:(Math.random() - .5) * 120, vy:-50 - Math.random() * 90, g:160, max:.8, vr:240 }); c.g.remove(); });
      ov.n.cr = []; }
    if (t > .1 && t < REL && every('ks', .12)) spawn('star', wx - dir * 14 + (Math.random() - .5) * 20, cy - 10 - Math.random() * 40, { c:'#e6f7ff', r:2.4, vy:-25, max:.7, vr:180 });
  }
  // Dampfkraft (Brunhilde)
  else if (ov.kind === 'dampf'){
    const s = easeOut(t / .45), fade = t > REL + .9 ? clamp(1 - (t - REL - .9) / .5, 0, 1) : 1;
    ov.n.cog1.setAttribute('transform', `translate(${(wx - dir * 6).toFixed(1)} ${cy - 10}) rotate(${(t * 90).toFixed(0)}) scale(${s.toFixed(2)})`);
    ov.n.cog2.setAttribute('transform', `translate(${(wx + dir * 28).toFixed(1)} ${cy + 22}) rotate(${(-t * 140).toFixed(0)}) scale(${s.toFixed(2)})`);
    ov.n.cog1.setAttribute('opacity', fade.toFixed(2)); ov.n.cog2.setAttribute('opacity', fade.toFixed(2));
    if (t > .12 && t < REL + .3 && every('st', .045)){
      spawn('dot', wx - dir * 18, cy - 46, { c:'#f4f1ea', r:3.2, grow:2.6, vx:-dir * 12 + (Math.random() - .5) * 14, vy:-38 - Math.random() * 22, max:.9 });
      if (Math.random() < .6) spawn('dot', wx + dir * 12, cy - 54, { c:'#e9e4d8', r:2.6, grow:2.4, vx:(Math.random() - .5) * 20, vy:-30 - Math.random() * 20, max:.8 });
    }
    if (t >= REL && !ov.fl.puff){ ov.fl.puff = 1;
      for (let k = 0; k < 16; k++){ const a = k / 16 * 6.283; spawn('dot', wx, cy - 20, { c:'#f4f1ea', r:4, grow:2.6, vx:Math.cos(a) * (70 + Math.random() * 60), vy:Math.sin(a) * (50 + Math.random() * 40), max:.9 }); } }
  }
  // Standard (Super-Zug)
  else {
    if (!ov.fl.burst && t > .3){ ov.fl.burst = 1; for (let k = 0; k < 18; k++){ const a = k / 18 * 6.283;
      spawn('star', wx, cy, { c:'#ffd23f', r:4, vx:Math.cos(a) * 130, vy:Math.sin(a) * 130, max:.8, vr:240 }); } }
  }

  // Wackeln, solange der Effekt läuft
  if (ov.shake > .05){ ov.shake *= Math.exp(-dt * 4.5); } else ov.shake = 0;
  // Jubel-Sternchen für den Sieger
  if (t > REL + .4 && t < REL + 2.2 && every('cf', .09)) spawn('star', wx + (Math.random() - .5) * 60, cy - 30 - Math.random() * 40, { c:['#ffd23f', '#ff7a3d', '#fff'][Math.random() * 3 | 0], r:3 + Math.random() * 2, vx:(Math.random() - .5) * 60, vy:-30 - Math.random() * 40, g:80, max:1, vr:200 });
}

let T = 0, lastT = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  if (!$('#sGame').classList.contains('active') || !figs[0]) return;
  T += dt;
  G.posCur += (G.pos - G.posCur) * Math.min(1, dt * 7);
  const shift = G.posCur / 100 * CONFIG.shiftMax, base = [SC.x0 + shift, SC.x1 + shift];
  const ov = G.over; if (ov) ov.t += dt;

  const P = [computePose(0, base[0], ov, dt), computePose(1, base[1], ov, dt)];
  for (let i = 0; i < 2; i++){
    const f = figs[i], p = P[i]; f.wx = p.x;
    sceneRefs.a[i].setAttribute('transform', `translate(${p.x.toFixed(1)},${(SC.groundY + p.y).toFixed(1)})`);
    f.up.setAttribute('transform', `translate(${p.tx.toFixed(2)},${p.ty.toFixed(2)}) rotate(${p.lean.toFixed(2)} ${f.px.toFixed(1)} ${f.hipY.toFixed(1)})`);
    f.lg.setAttribute('transform', `scale(1,${p.legSy.toFixed(3)})`);
  }
  // Griffpunkte, Seil und Fäuste
  const gp = [[gripWorld(0, P[0], 0), gripWorld(0, P[0], 1)], [gripWorld(1, P[1], 0), gripWorld(1, P[1], 1)]];
  const outer = [gp[0][0], gp[1][0]];
  const ropeOn = !ov || ov.t < REL + .45;
  sceneRefs.rope.style.display = ropeOn ? '' : 'none';
  if (ropeOn){
    const ten = clamp(Math.max(Math.abs(G.pl[0].kick), Math.abs(G.pl[1].kick)) / 12, 0, 1);
    const sag = ov ? 1.5 : 10 - 6.5 * ten + (RM ? 0 : Math.sin(T * 6) * .8);
    const mx = (outer[0].x + outer[1].x) / 2, my = (outer[0].y + outer[1].y) / 2;
    const d = `M${outer[0].x.toFixed(1)},${outer[0].y.toFixed(1)} Q${mx.toFixed(1)},${(my + sag * 2).toFixed(1)} ${outer[1].x.toFixed(1)},${outer[1].y.toFixed(1)}`;
    sceneRefs.ropeB.setAttribute('d', d); sceneRefs.ropeF.setAttribute('d', d); sceneRefs.ropeG.setAttribute('d', d);
    sceneRefs.flag.setAttribute('transform', `translate(${mx.toFixed(1)},${(my + sag).toFixed(1)})`);
    for (let i = 0; i < 2; i++) for (let k = 0; k < 2; k++){ const c = figs[i].fists[k], q = gp[i][k]; c.setAttribute('cx', q.x.toFixed(1)); c.setAttribute('cy', q.y.toFixed(1)); }
  }
  if (ov) sigUpdate(ov, dt, P, outer);
  updateParts(dt);
  if (!RM){
    sceneRefs.cl1.setAttribute('transform', `translate(${((T * 4) % 560) - 140},0)`);
    sceneRefs.cl2.setAttribute('transform', `translate(${((T * 2.5 + 260) % 560) - 140},0)`);
  }
  if (ov && ov.shake > 0 && !RM) sceneRefs.world.setAttribute('transform', `translate(${((Math.random() - .5) * ov.shake).toFixed(1)} ${((Math.random() - .5) * ov.shake).toFixed(1)})`);
  else if (ov) sceneRefs.world.removeAttribute('transform');
}

/* =====================================================================
   7. RENDERING – Taschenrechner, Anzeige, Kopfzeile
   ===================================================================== */
function buildCalcs(){
  $$('.calc').forEach(p => {
    const i = +p.dataset.p;
    p.innerHTML = `
      <div class="chead"><span class="cn">Spieler ${i + 1}</span><span class="cs"></span></div>
      <div class="lcd"><div class="task"></div><div class="inp"></div><div class="fb"></div></div>
      <div class="keys">
        ${['7','8','9','4','5','6','1','2','3'].map(k => `<button data-k="${k}">${k}</button>`).join('')}
        <button class="del" data-k="del" aria-label="Löschen">⌫</button>
        <button data-k="0">0</button>
        <button class="okb" data-k="ok" aria-label="Eingabe bestätigen">OK</button>
      </div>`;
    p.addEventListener('pointerdown', e => {
      const b = e.target.closest('button[data-k]'); if (!b) return;
      e.preventDefault();
      b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 90);
      press(i, b.dataset.k);
    });
    p.addEventListener('contextmenu', e => e.preventDefault());
  });
}

function fit(el, max, min){
  if (!el.clientWidth) return;
  let s = Math.round(max);
  el.style.fontSize = s + 'px';
  while (el.scrollWidth > el.clientWidth + 1 && s > min){ s--; el.style.fontSize = s + 'px'; }
}

function renderPanel(i){
  const p = $$('.calc')[i], st = G.pl[i];
  const lcd = p.querySelector('.lcd'), tk = p.querySelector('.task'), ip = p.querySelector('.inp');
  const H = lcd.clientHeight || 70;
  tk.textContent = st.task ? st.task.text : '…';
  if (st.reveal && st.task){ ip.textContent = 'Lösung: ' + fmt(st.task.answer); ip.classList.add('rev'); }
  else { ip.classList.remove('rev'); ip.textContent = st.input === '' ? '' : fmt(+st.input); }
  fit(tk, H * .27, 11);
  fit(ip, H * .38, 12);
}

function updateTags(){
  [0,1].forEach(i => {
    $('#nm' + i).textContent = G.names[i];
    $('#sc' + i).textContent = '✓ ' + G.pl[i].correct;
    const p = $$('.calc')[i];
    p.querySelector('.cn').textContent = G.names[i];
    p.querySelector('.cs').textContent = '✓ ' + G.pl[i].correct;
  });
}
function updateMeter(){ $('#ml').style.width = (50 - G.pos / 2) + '%'; }

function flash(i, kind){
  const p = $$('.calc')[i];
  p.classList.remove('ok', 'bad'); void p.offsetWidth;
  p.querySelector('.fb').textContent = kind === 'ok' ? '✓' : '✗';
  p.querySelector('.fb').style.color = kind === 'ok' ? '#0a8a3f' : '#c01b33';
  p.classList.add(kind);
}

/* =====================================================================
   8. SPIELABLAUF
   ===================================================================== */
function show(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if (id !== 'sGame') $('#pauseOv').classList.remove('on');
}

function startMatch(){
  clearTimers();
  G.pos = 0; G.posCur = 0; G.over = null; G.parts = [];
  G.pl = [newP(), newP()];
  G.step = CONFIG.ropeSteps[G.rope];
  $$('.calc')[1].classList.toggle('flip', G.mirror);
  buildFigures(); updateTags(); updateMeter();
  G.sig = null; show('sGame');
  [0,1].forEach(renderPanel);
  G.phase = 'count';
  runCountdown(['3','2','1','Los!'], 0);
}

function runCountdown(seq, k){
  const el = $('#count');
  el.textContent = seq[k]; restartAnim(el, 'pop');
  if (k < seq.length - 1){ SND.count(); later(() => runCountdown(seq, k + 1), CONFIG.countMs); }
  else {
    SND.go(); G.phase = 'play';
    giveTask(0); giveTask(1);
    later(() => { el.textContent = ''; }, 700);
  }
}

function giveTask(i){
  if (G.phase === 'pause'){ later(() => giveTask(i), 300); return; }
  if (G.phase !== 'play') return;
  const st = G.pl[i];
  st.task = genTask(G.level, st.prev); st.prev = st.task.text;
  st.input = ''; st.tries = 0; st.locked = false; st.reveal = false; st.t0 = performance.now();
  renderPanel(i);
}

function press(i, k){
  audio();
  if (G.phase !== 'play') return;
  const st = G.pl[i];
  if (st.locked || !st.task) return;
  if (k === 'ok'){ submit(i); return; }
  if (k === 'del'){ st.input = st.input.slice(0, -1); SND.tick(); }
  else {
    if (st.input.length >= CONFIG.maxInput) return;
    st.input = st.input === '0' ? k : st.input + k; SND.tick();
  }
  renderPanel(i);
}

function submit(i){
  const st = G.pl[i];
  if (st.input === ''){ st.wob = 0; flash(i, 'bad'); SND.bad(); return; }
  if (+st.input === st.task.answer){
    const secs = (performance.now() - st.t0) / 1000;
    st.correct++; if (st.best === null || secs < st.best) st.best = secs;
    G.pos = Math.max(-100, Math.min(100, G.pos + (i === 0 ? -1 : 1) * G.step));
    st.kick = -10; G.pl[1 - i].kick = 14; dust(i, 4);
    flash(i, 'ok'); SND.ok(); updateTags(); updateMeter();
    if (Math.abs(G.pos) >= 100) endGame(i); else giveTask(i);
  } else {
    st.wrong++; st.tries++; st.wob = 6;
    flash(i, 'bad'); SND.bad();
    if (st.tries >= CONFIG.maxTries){
      st.locked = true; st.reveal = true; renderPanel(i);
      later(() => giveTask(i), CONFIG.revealMs);
    } else { st.input = ''; renderPanel(i); }
  }
}

function endGame(w){
  G.phase = 'over'; G.over = { w, t:0, splashed:false, kind:(AVATARE[G.av[w]].signatur || 'power') };
  G.pl.forEach(p => p.locked = true);
  sigInit(G.over);
  later(showWin, CONFIG.winDelayMs);
}

function pauseGame(){
  if (G.phase !== 'play') return;
  G.phase = 'pause'; G.pausedAt = performance.now(); $('#pauseOv').classList.add('on');
}
function resumeGame(){
  if (G.phase !== 'pause') return;
  const d = performance.now() - G.pausedAt;
  G.pl.forEach(p => p.t0 += d);
  G.phase = 'play'; $('#pauseOv').classList.remove('on');
}
function quitToStart(){ clearTimers(); G.phase = 'idle'; G.over = null; show('sStart'); heroes(); }

/* =====================================================================
   9. SIEGERBILDSCHIRM
   ===================================================================== */
function showWin(){
  const w = G.over ? G.over.w : 0;
  $('#wAv').innerHTML = imgTag(AVATARE[G.av[w]]);
  $('#wSub').textContent = AVATARE[G.av[w]].name + ' – ' + AVATARE[G.av[w]].titel;
  $('#wTitle').textContent = `★ ${G.names[w]} gewinnt! ★`;
  const s = G.pl;
  const acc = p => (p.correct + p.wrong) ? Math.round(p.correct / (p.correct + p.wrong) * 100) + ' %' : '–';
  const best = p => p.best === null ? '–' : p.best.toFixed(1).replace('.', ',') + ' s';
  const rows = [['Richtig', s[0].correct, s[1].correct], ['Fehler', s[0].wrong, s[1].wrong],
                ['Trefferquote', acc(s[0]), acc(s[1])], ['Schnellste Lösung', best(s[0]), best(s[1])]];
  $('#wStats').innerHTML =
    `<tr><th></th><th class="c0">${esc(G.names[0])}</th><th class="c1">${esc(G.names[1])}</th></tr>` +
    rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  const cf = $('#confetti'); cf.innerHTML = '';
  const cols = ['#ffd23f', '#ff7a3d', '#2f7bff', '#46c35c', '#ff4d6d', '#ffffff'];
  for (let k = 0; k < 36; k++){
    const i = document.createElement('i');
    i.style.left = Math.random() * 100 + '%';
    i.style.background = cols[k % cols.length];
    i.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
    i.style.animationDelay = (-Math.random() * 4) + 's';
    cf.appendChild(i);
  }
  show('sWin'); SND.win();
}

/* =====================================================================
   10. MENÜS: START, STUFE, AVATARWAHL
   ===================================================================== */
function heroes(){
  const i = randFilled(), j = randFilled(i);
  $('#heroL').innerHTML = imgTag(AVATARE[i]);
  $('#heroR').innerHTML = imgTag(AVATARE[j]);
}

const SEL = [null, null];
function buildAvatarScreen(){
  [0, 1].forEach(p => {
    const grid = $(`.pick[data-p="${p}"] .agrid`);
    grid.innerHTML = AVATARE.map((a, k) => isFree(a)
      ? `<div class="ab blank" aria-label="Platz frei"><span>frei</span></div>`
      : `<button class="ab" data-k="${k}" aria-label="${esc(a.name + ', ' + a.titel)}" title="${esc(a.name + ' – ' + a.titel)}"><img src="${a.bild}" alt="" draggable="false" style="height:${Math.round(100 * Math.min(1, (a.groesse || BODY_H) / 150))}%"></button>`).join('');
    grid.addEventListener('click', e => {
      const b = e.target.closest('.ab[data-k]'); if (!b) return;
      const k = +b.dataset.k; if (SEL[1 - p] === k) return;
      SEL[p] = k; refreshPicks(); SND.tick();
    });
  });
}
function refreshPicks(){
  [0, 1].forEach(p => {
    $$(`.pick[data-p="${p}"] .ab[data-k]`).forEach(b => {
      const k = +b.dataset.k;
      b.classList.toggle('sel', SEL[p] === k);
      b.classList.toggle('taken', SEL[1 - p] === k);
    });
    $(`.pick[data-p="${p}"] .aname`).textContent = SEL[p] === null ? '' : AVATARE[SEL[p]].name;
  });
  $('#btnGo').disabled = SEL[0] === null || SEL[1] === null;
}
function randomDefaults(){
  if (SEL[0] === null) SEL[0] = randFilled(SEL[1]);
  if (SEL[1] === null) SEL[1] = randFilled(SEL[0]);
}

/* =====================================================================
   11. EINGABE / EREIGNISSE
   ===================================================================== */
function init(){
  buildScene(); buildCalcs(); buildAvatarScreen(); heroes();

  $('#btnPlay').addEventListener('click', () => { audio(); show('sLevel'); });
  $$('[data-back]').forEach(b => b.addEventListener('click', () => show(b.dataset.back)));

  $$('.lv').forEach(b => b.addEventListener('click', () => {
    G.level = +b.dataset.l; randomDefaults(); refreshPicks(); show('sAvatar');
  }));
  $$('[data-r]').forEach(b => b.addEventListener('click', () => {
    G.rope = b.dataset.r;
    $$('[data-r]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  }));
  $('#optMirror').addEventListener('click', e => {
    G.mirror = !G.mirror;
    e.currentTarget.setAttribute('aria-pressed', String(G.mirror));
    e.currentTarget.textContent = 'Tischmodus: ' + (G.mirror ? 'an' : 'aus');
  });
  const syncSound = () => {
    $('#optSound').setAttribute('aria-pressed', String(G.sound));
    $('#optSound').textContent = 'Ton: ' + (G.sound ? 'an' : 'aus');
    $('#btnMute').textContent = G.sound ? '🔊' : '🔇';
  };
  $('#optSound').addEventListener('click', () => { G.sound = !G.sound; syncSound(); });
  $('#btnMute').addEventListener('click', () => { G.sound = !G.sound; syncSound(); });

  $('#btnGo').addEventListener('click', () => {
    if (SEL[0] === null || SEL[1] === null) return;
    G.av = [SEL[0], SEL[1]];
    const n = $$('.pick input').map(x => x.value.trim());
    G.names = [n[0] || 'Spieler 1', n[1] || 'Spieler 2'];
    startMatch();
  });

  $('#btnPause').addEventListener('click', pauseGame);
  $('#btnResume').addEventListener('click', resumeGame);
  $('#btnQuit').addEventListener('click', quitToStart);
  $('#bRe').addEventListener('click', startMatch);
  $('#bLv').addEventListener('click', () => show('sLevel'));
  $('#bAv').addEventListener('click', () => { refreshPicks(); show('sAvatar'); });

  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.addEventListener('resize', () => { if ($('#sGame').classList.contains('active')) [0, 1].forEach(renderPanel); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('pointerdown', audio, { once:true });

  show('sStart');
  requestAnimationFrame(frame);
}
Promise.all(AVATARE.filter(a => !isFree(a) && !(a.w && a.h && a.ax != null)).map(prepareAvatar)).then(init);

})();
</script>
</body>
